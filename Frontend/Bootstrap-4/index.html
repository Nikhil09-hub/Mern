<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <!-- Responsive Navigation Bar -->
     <nav class="navbar navbar-expand-sm bg-warning px-2">
        <!-- Logo -->
        <a href="#">
            <img src="../assets/logos/lg5.jpg" width="50px" alt="">
        </a>
        <a href="#" class="navbar-brand text-danger ps-2">LOGO</a>
        <button class="btn btn-info navbar-toggler" data-bs-target="#menu" data-bs-toggle="collapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Menu -->
        <div id="menu" class="collapse navbar-collapse">
         <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a href="#" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Sign-Up</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Sign-In</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Contact</a>
            </li>
         </ul>
        </div>
     </nav>
    <!-- Modal Component -->
    <button class="btn btn-warning m-5" data-bs-target="#m" data-bs-toggle="modal">Open</button>

    <div class="modal fade" id="m" data-bs-backdrop="static">
        <!-- smaill size -sm and large size - lg -->
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">User info
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img src="../assets/emp-profile-imgs/2.jpg" class="w-100" alt="">
                    <h3>Lorem ipsum dolor sit.</h3>
                    <p>
                        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quod nobis quibusdam reprehenderit quia praesentium similique.
                    </p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success">Send</button>
                </div>
            </div>
        </div>
     </div>
     <button class="btn btn-warning" data-bs-target="#sidebar" data-bs-toggle="offcanvas">SideBar</button>
    <!-- Off Canvas -->
     <!-- start end top bottom -->
    <div class="offcanvas offcanvas-start" id="sidebar">
        <div class="offcanvas-header">Header</div>
        <div class="offcanvas-body">Body</div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
